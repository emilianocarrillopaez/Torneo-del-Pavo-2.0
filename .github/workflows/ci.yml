name: Calidad, Reglas y Seguridad (CI)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Lint, Tipos, Unitarias, Auditoría y Build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4.2.2

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.23.5'

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: '1.4.4'

      - name: Instalar dependencias con lockfile congelado
        run: bun install --frozen-lockfile

      - name: Reiniciar carpeta limpia de reportes
        run: bun run reports:clean

      - name: Auditoría de dependencias (falla ante High/Critical)
        shell: bash
        run: |
          set -o pipefail
          bun audit --audit-level=high 2>&1 | tee reports/audit.txt

      - name: Verificación de tipos y ESLint
        shell: bash
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee reports/lint.txt
          bun run lint:rules 2>&1 | tee reports/rules-lint.txt

      - name: Pruebas unitarias y cabeceras
        shell: bash
        run: |
          set -o pipefail
          bun run test 2>&1 | tee reports/unit-tests.txt

      - name: Verificar bloqueo de build si falta VITE_SITE_URL
        run: |
          if STRICT_SITE_URL=1 VITE_SITE_URL="" node scripts/generate-seo-files.mjs >/dev/null 2>&1; then
            echo "La compilación debió fallar sin VITE_SITE_URL."
            exit 1
          fi

      - name: Compilar producción para Cloudflare
        shell: bash
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://torneo-del-pavo.pages.dev' }}
          VITE_APP_ENV: production
          STRICT_SITE_URL: '1'
        run: |
          set -o pipefail
          bun run build 2>&1 | tee reports/build.txt

      - name: Validar artefactos generados para Cloudflare
        run: |
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/img/cartel-2026.webp
          test ! -e dist/404.html
          test ! -d dist/assets/aistudio

      - name: Verificar configuración Wrangler y empaque estático (dry-run)
        shell: bash
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -o pipefail
          bun run check:wrangler 2>&1 | tee -a reports/build.txt
          ./node_modules/.bin/wrangler deploy --dry-run 2>&1 | tee -a reports/build.txt

      - name: Generar resumen y validar seguridad de reportes
        if: always()
        run: node scripts/ci-report.mjs --summary --job "Calidad, Lint, Unitarias, Auditoría y Build" --status "${{ job.status }}"

      - name: Subir reportes de calidad y build
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reportes-calidad
          path: reports/
          overwrite: true
          retention-days: 90
          if-no-files-found: warn

  firestore-rules:
    name: Pruebas de Reglas Firestore (Emulador)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4.2.2

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.23.5'

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: '1.4.4'

      - name: Configurar Java 21 para Firestore Emulator
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias con lockfile congelado
        run: bun install --frozen-lockfile

      - name: Reiniciar carpeta limpia de reportes
        run: bun run reports:clean

      - name: Ejecutar suite de reglas contra emulador (V1–V34)
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee reports/rules-tests.txt

      - name: Generar resumen y validar seguridad de reportes
        if: always()
        run: node scripts/ci-report.mjs --summary --job "Pruebas de Reglas Firestore (Emulador)" --status "${{ job.status }}"

      - name: Subir reportes de reglas Firestore
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reportes-reglas
          path: reports/
          overwrite: true
          retention-days: 90
          if-no-files-found: warn

  e2e-and-lighthouse:
    name: Pruebas E2E (Playwright) y Lighthouse CI
    runs-on: ubuntu-latest
    needs: [quality-and-build, firestore-rules]
    steps:
      - name: Descargar código
        uses: actions/checkout@v4.2.2

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.23.5'

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: '1.4.4'

      - name: Configurar Java 21 para Emuladores Firebase
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias con lockfile congelado
        run: bun install --frozen-lockfile

      - name: Reiniciar carpeta limpia de reportes
        run: bun run reports:clean

      - name: Instalar navegador Chromium de Playwright
        run: bunx playwright install chromium --with-deps

      - name: Compilar app configurada para emulador local
        shell: bash
        env:
          VITE_USE_FIRESTORE_EMULATOR: 'true'
          VITE_APP_ENV: staging
          VITE_SITE_URL: http://127.0.0.1:4173
          STRICT_SITE_URL: '1'
        run: |
          set -o pipefail
          bun run build 2>&1 | tee reports/build.txt

      - name: Ejecutar Playwright E2E + Axe contra build local y emulador
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          set -o pipefail
          ./node_modules/.bin/firebase emulators:exec --project yogic-decoder-5lxdt --only firestore,auth '
            ./node_modules/.bin/vite preview --port 4173 --host 127.0.0.1 >/tmp/vite-e2e.log 2>&1 &
            PREVIEW_PID=$!
            trap "kill $PREVIEW_PID 2>/dev/null || true" EXIT
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
              sleep 1
            done
            bun run test:e2e
          ' 2>&1 | tee reports/e2e.txt

      - name: Compilar producción para Lighthouse CI
        shell: bash
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://torneo-del-pavo.pages.dev' }}
          VITE_APP_ENV: production
          STRICT_SITE_URL: '1'
        run: |
          set -o pipefail
          bun run build 2>&1 | tee -a reports/build.txt

      - name: Ejecutar Lighthouse CI
        shell: bash
        run: |
          set -o pipefail
          npx --yes @lhci/cli@0.14.0 autorun 2>&1 | tee reports/lighthouse.txt

      - name: Generar resumen y validar seguridad de reportes
        if: always()
        run: node scripts/ci-report.mjs --summary --job "Pruebas E2E (Playwright) y Lighthouse CI" --status "${{ job.status }}"

      - name: Subir reportes E2E y Lighthouse
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reportes-e2e
          path: reports/
          overwrite: true
          retention-days: 90
          if-no-files-found: warn

  limpiar-reportes-antiguos:
    name: Limpiar Reportes Antiguos
    runs-on: ubuntu-latest
    needs: [quality-and-build, firestore-rules, e2e-and-lighthouse]
    if: always() && github.event_name == 'push' && github.event.repository.fork == false
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4.2.2

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.23.5'

      - name: Eliminar artefactos reportes-* de ejecuciones anteriores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEANUP_OLD_RUNS: ${{ vars.CLEANUP_OLD_RUNS || 'false' }}
        run: node scripts/cleanup-old-artifacts.mjs

# Nota sobre despliegue de reglas desde CI (opcional, desactivado por defecto):
# Si el organizador configura `secrets.FIREBASE_SERVICE_ACCOUNT` (cuenta de servicio
# con permiso mínimo `Cloud Firestore Rules Admin`) y habilita `vars.ENABLE_CI_RULES_DEPLOY == 'true'`,
# puede descomentar este trabajo que corre ÚNICAMENTE en rama `main` (nunca en PRs/forks):
